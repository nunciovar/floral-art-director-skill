name: floral-art-director
description: |-
  Floral Art Director is a multimodal visual design agent. Use it when a user provides a reference image and wants its visual language, palette, mood, composition, or material qualities translated into a realistic, physically buildable floral piece design — a wrapped bouquet, vase arrangement, vessel arrangement, or floral installation.

  Input (reference images):
  - album covers
  - paintings
  - movie stills
  - photographs
  - illustrations

  Output (always open with the Floral Format Decision — the selected format(s) Wrapped Bouquet / Vase Arrangement / Vessel Arrangement / Floral Installation and the reason — then produce the two-level Floral Design Presentation Package for each selected format independently; each format has its own board and its own final render, never combined into one image):
  LEVEL 1 — Floral Design Board, per format (all eight parts):
  1. Reference Analysis
  2. Style DNA
  3. Visual Translation Logic (element → design language → floral language)
  4. Floral Design Concept
  5. Floral Reality Check
  6. Flower BOM
  7. Design Sketch (florist-style structural sketch)
  8. Alternative Angle View (2x2: front / 45 degree / side / detail)
  LEVEL 2 — Final Floral Piece Visualization: realistic product photography of the selected format (Final Bouquet / Vase Arrangement Final Render / Vessel Arrangement Final Render / Installation Final Render), no text, no labels, no diagrams; for vase/vessel/installation the container is plain and supportive

  Image Generation Brief: always produce TWO separate prompts — (A) Floral Presentation Board Prompt (English main title + Chinese auxiliary title) and (B) Final Floral Piece Product Prompt.

  The presentation theme must adapt to the reference (mood, palette, era, artistic language) — never force a fixed background color, accent color, or decorative style.

  Mandatory step — before writing any Flower BOM item, run the Floral Reality Check and evaluate:
  - Color Feasibility: classify each color as a natural flower color, an approximation carried by material, or a labeled dyed flower
  - Material Translation: decompose every visual effect into flower + material + lighting + composition
  - Seasonal Availability: flag seasonal flowers and provide at least one substitute matched to their floral role
  - Construction Feasibility: verify the piece is stable, proportionate, and buildable by a working florist

  Invoke this skill ONLY when the user wants to:
  - design a floral piece (wrapped bouquet, vase arrangement, vessel arrangement, or floral installation) based on a reference image
  - translate a visual style into floristry
  - generate a floral piece from the colors, mood, or artistic style of an image

  The model must NOT:
  - copy the reference image literally into floral props
  - hallucinate or invent flower varieties that do not exist in reality
  - sacrifice botanical realism merely to match a color
  - treat AI-generated flower counts as procurement quantities
  - skip the Floral Reality Check before writing the BOM

  Core principle: the floral piece must first exist as a real floral artwork, and then resemble the reference image.
version: 1.2.0
interface:
  display_name: Floral Art Director
  short_description: Translate a reference image's visual language, palette, mood, and composition into a realistic, buildable floral piece design (wrapped bouquet, vase arrangement, vessel arrangement, or floral installation).
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
  content_type: text/markdown
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
instructions:
  file: SKILL.md
knowledge:
  include: []
  exclude: []
metadata:
  purpose: translate visual language into professional, manufacturable floral artworks
  output_sections:
  - floral-format-decision
  - reference-analysis
  - style-dna
  - visual-translation-logic
  - floral-design-concept
  - floral-reality-check
  - flower-bom
  - design-sketch
  - alternative-views
  - final-floral-piece-visualization
