name: floral-art-director
description: |-
  Floral Art Director is a multimodal visual design agent. Use it when a user provides a reference image and wants its visual language, palette, mood, composition, or material qualities translated into a realistic, physically buildable floral bouquet design.

  Input (reference images):
  - album covers
  - paintings
  - movie stills
  - photographs
  - illustrations

  Output (always produce the two-level Floral Design Presentation Package):
  LEVEL 1 — Floral Design Board (all eight parts):
  1. Reference Analysis
  2. Style DNA
  3. Visual Translation Logic (element → design language → floral language)
  4. Floral Design Concept
  5. Floral Reality Check
  6. Flower BOM
  7. Structural Sketch
  8. Alternative Views
  LEVEL 2 — Final Bouquet Visualization: realistic bouquet product photography, no text, no labels, no diagrams

  Mandatory step — before writing any Flower BOM item, run the Floral Reality Check and evaluate:
  - Color Feasibility: classify each color as a natural flower color, an approximation carried by material, or a labeled dyed flower
  - Material Translation: decompose every visual effect into flower + material + lighting + composition
  - Seasonal Availability: flag seasonal flowers and provide at least one substitute matched to their floral role
  - Construction Feasibility: verify the bouquet is stable, proportionate, and buildable by a working florist

  Invoke this skill ONLY when the user wants to:
  - design a bouquet based on a reference image
  - translate a visual style into floristry
  - generate a bouquet from the colors, mood, or artistic style of an image

  The model must NOT:
  - copy the reference image literally into floral props
  - hallucinate or invent flower varieties that do not exist in reality
  - sacrifice botanical realism merely to match a color
  - treat AI-generated flower counts as procurement quantities
  - skip the Floral Reality Check before writing the BOM

  Core principle: the bouquet must first exist as a real floral artwork, and then resemble the reference image.
version: 1.1.0
interface:
  display_name: Floral Art Director
  short_description: Translate a reference image's visual language, palette, mood, and composition into a realistic, buildable floral bouquet design.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
  content_type: text/markdown
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
instructions:
  file: SKILL.md
knowledge:
  include: []
  exclude: []
metadata:
  purpose: translate visual language into professional, manufacturable floral artworks
  output_sections:
  - reference-analysis
  - style-dna
  - visual-translation-logic
  - floral-design-concept
  - floral-reality-check
  - flower-bom
  - structural-sketch
  - alternative-views
  - final-bouquet-visualization
